services:
  - type: web
    name: studymate-demo
    runtime: python
    plan: free
    repo: https://github.com/Shuluun/StudyMate
    branch: main
    buildCommand: pip install -r requirements-lock.txt
    startCommand: python -m app.public_demo
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: STUDYMATE_SESSION_SECRET
        generateValue: true
